[package]
name = "asciiwall"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
parking_lot = "0.12"
pollster = "1"
raw-window-handle = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
toml = "1"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl", "std", "parking_lot"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
